name: Publish portfolio and pinned Knowledge Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify original portfolio
        run: npm test
      - name: Build pinned Ordo Knowledge Lab from public source
        run: npm run build:knowledge
      - name: Verify mirrored student guide and navigation
        run: npm run verify:knowledge
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-and-knowledge-lab-static-site
          path: docs/.vitepress/dist
          retention-days: 14
      - name: Commit verified site to existing gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_PREBUILT: 'true'
        run: npm run deploy
      - name: Record scope
        run: |
          echo 'Portfolio source and pinned is373-rag revision passed static checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A published-branch push is not proof of public Pages availability. Check the actual URL separately.' >> "$GITHUB_STEP_SUMMARY"
